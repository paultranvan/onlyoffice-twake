# Timing-aware nginx access log format for the Twake OnlyOffice overlay.
#
# Loaded at the top of the http{} block (see dist/Dockerfile) so it is defined
# before any access_log directive references it. Used by the DS server when
# NGINX_ACCESS_LOG=true (baked on by default in the overlay).
#
# Fields:
#   rt    total request time seen by nginx (seconds)
#   urt   time spent in the upstream node backend (docservice/converter);
#         "-" for statically served assets (fonts, sdkjs, web-apps, ...)
#   cache upstream cache status ("-" when no proxy cache is configured)
#   len   bytes sent to the client
#
# Reading it: big rt + small/absent urt  => client/network side (slow download,
# large asset, distant client). big urt  => backend (node service, PostgreSQL,
# RabbitMQ or Redis behind it).
log_format ds_timing '$remote_addr $host $status "$request" '
                     'rt=$request_time urt=$upstream_response_time '
                     'cache=$upstream_cache_status len=$body_bytes_sent '
                     'ref="$http_referer" ua="$http_user_agent"';
