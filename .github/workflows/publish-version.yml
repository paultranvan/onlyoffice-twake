name: Publish version to Harbor

on:
  workflow_call:
    outputs:
      version:
        description: 'The version published, extracted from the tag'
        value: ${{ jobs.publish.outputs.version }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"
      - name: Build analytics-free editor bundles
        run: ./build-webapps.sh
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push to Harbor (multi-arch, chunked)
        # Harbor's proxy times out (504) on a one-shot push of the ~1GB base layer.
        # push-multiarch.sh uploads blobs in 16MB chunks via regctl, which gets past it.
        env:
          IMAGE: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/onlyoffice-noanalytics:${{ steps.version.outputs.version }}
        run: ./dist/push-multiarch.sh
