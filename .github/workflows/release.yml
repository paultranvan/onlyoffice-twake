name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish version
    uses: ./.github/workflows/publish-version.yml
    secrets: inherit

  # Layered on the base the job above just pushed, so it must wait for it.
  scribe:
    name: Publish Scribe overlay
    needs: [publish]
    uses: ./.github/workflows/publish-scribe.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit

  release:
    name: Create GitHub release
    # Only cut a release once both images of the family are on Harbor.
    needs: [publish, scribe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
